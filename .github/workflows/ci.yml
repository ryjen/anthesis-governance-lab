name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: governance-lab-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structural-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out governance lab
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Validate shell and trust boundaries
        run: |
          set -euo pipefail
          bash -n \
            scripts/acquire-anthesis-lab.sh \
            scripts/aggregate-demo-packs.sh \
            scripts/run-demo-pack.sh \
            scripts/validate-demo-packs.sh \
            scripts/validate-governance-lab.sh \
            scripts/validate-docs-and-catalog.sh \
            scripts/validate-inference-integrity-fixtures.sh \
            scripts/validate-inference-capacity-fixtures.sh \
            scripts/validate-inference-final-catalog.sh \
            scripts/validate-inference-scenario-catalog.sh \
            scripts/validate-executable-inference-integrity.sh \
            scripts/validate-walkthroughs.sh
          ! grep -RInE '(^|[^[:alnum:]_])(python3?|pip|pytest)([^[:alnum:]_]|$)' scripts
          bash scripts/validate-docs-and-catalog.sh
          bash scripts/validate-inference-integrity-fixtures.sh
          bash scripts/validate-inference-capacity-fixtures.sh
          bash scripts/validate-inference-final-catalog.sh
          bash scripts/validate-inference-scenario-catalog.sh
          bash scripts/validate-walkthroughs.sh

          outside="$RUNNER_TEMP/anthesis-governance-lab-rejected-install"
          rm -rf "$outside"
          set +e
          bash scripts/acquire-anthesis-lab.sh "$outside" >/tmp/acquire.out 2>/tmp/acquire.err
          status=$?
          set -e
          test "$status" -eq 3
          test ! -e "$outside"
          grep -Fq 'install directory must remain inside the repository workspace' /tmp/acquire.err

          endpoint_fixture="$(mktemp -d "$RUNNER_TEMP/anthesis-endpoint.XXXXXX")"
          trap 'rm -rf "$endpoint_fixture"' EXIT
          mkdir -p "$endpoint_fixture/scripts" "$endpoint_fixture/.anthesis"
          cp scripts/acquire-anthesis-lab.sh "$endpoint_fixture/scripts/"
          cp .anthesis/cli-artifact.env "$endpoint_fixture/.anthesis/"
          sed -i \
            's#^ANTHESIS_RELEASE_REPOSITORY=.*#ANTHESIS_RELEASE_REPOSITORY=attacker.invalid/capture#' \
            "$endpoint_fixture/.anthesis/cli-artifact.env"
          set +e
          GITHUB_TOKEN=must-not-be-sent \
            bash "$endpoint_fixture/scripts/acquire-anthesis-lab.sh" \
            > /tmp/endpoint.out 2> /tmp/endpoint.err
          status=$?
          set -e
          test "$status" -eq 3
          grep -Fq 'release repository is not the trusted public distribution repository' \
            /tmp/endpoint.err
          test ! -e "$endpoint_fixture/.anthesis/bin"

          parser_fixture="$(mktemp -d "$RUNNER_TEMP/anthesis-parser.XXXXXX")"
          mkdir -p "$parser_fixture/scripts" "$parser_fixture/.anthesis"
          cp scripts/acquire-anthesis-lab.sh "$parser_fixture/scripts/"
          cp .anthesis/cli-artifact.env "$parser_fixture/.anthesis/"
          marker="$parser_fixture/metadata-executed"
          sed -i \
            "s#^ANTHESIS_REVISION=.*#ANTHESIS_REVISION=\$(touch $marker)#" \
            "$parser_fixture/.anthesis/cli-artifact.env"
          set +e
          bash "$parser_fixture/scripts/acquire-anthesis-lab.sh" \
            > /tmp/parser.out 2> /tmp/parser.err
          status=$?
          set -e
          test "$status" -eq 3
          test ! -e "$marker"
          grep -Fq 'Anthesis revision must be a full commit SHA' /tmp/parser.err

  executable-validation:
    needs: structural-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out governance lab
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Acquire checksum-verified public Rust CLI
        run: bash scripts/acquire-anthesis-lab.sh

      - name: Validate public contracts and canonical scenarios
        run: bash scripts/validate-governance-lab.sh

      - name: Validate executable inference-integrity suite
        run: bash scripts/validate-executable-inference-integrity.sh

      - name: Validate all cataloged demo packs
        run: bash scripts/validate-demo-packs.sh
