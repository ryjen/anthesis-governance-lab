name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  governance-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out governance lab
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Validate shell and workspace boundaries
        run: |
          set -euo pipefail
          bash -n scripts/acquire-anthesis-lab.sh scripts/validate-governance-lab.sh
          ! grep -RInE '(^|[^[:alnum:]_])(python3?|pip|pytest)([^[:alnum:]_]|$)' scripts

          outside="$RUNNER_TEMP/anthesis-governance-lab-rejected-install"
          rm -rf "$outside"
          set +e
          bash scripts/acquire-anthesis-lab.sh "$outside" >/tmp/acquire.out 2>/tmp/acquire.err
          status=$?
          set -e
          test "$status" -eq 3
          test ! -e "$outside"
          grep -Fq 'install directory must remain inside the repository workspace' /tmp/acquire.err

      - name: Acquire checksum-verified promoted Rust CLI
        env:
          GITHUB_TOKEN: ${{ secrets.ANTHESIS_ARTIFACT_TOKEN || github.token }}
        run: bash scripts/acquire-anthesis-lab.sh

      - name: Validate public contracts and canonical scenarios
        run: bash scripts/validate-governance-lab.sh
