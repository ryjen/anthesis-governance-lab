name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out governance lab
        uses: actions/checkout@v4

      - name: Check out pinned public contract
        uses: actions/checkout@v4
        with:
          repository: hackelia-micrantha/anthesis-community
          ref: 7f6cdd59c640d38a2e951032ca5c9a1707b696f2
          path: .contract

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest pyyaml==6.0.2

      - name: Verify pinned contract synchronization
        run: python scripts/check_contract_sync.py

      - name: Run lab tests
        run: pytest
