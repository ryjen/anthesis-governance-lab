name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  governance-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out governance lab
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Acquire checksum-verified promoted Rust CLI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/acquire-anthesis-lab.sh

      - name: Validate public contracts and canonical scenarios
        run: bash scripts/validate-governance-lab.sh

      - name: Confirm Python-free validation surface
        run: |
          set -euo pipefail
          ! grep -RInE '(^|[^[:alnum:]_])(python3?|pip|pytest)([^[:alnum:]_]|$)' \
            .github scripts .anthesis/cli-artifact.env README.md
